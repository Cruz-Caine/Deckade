name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libsdl2-dev libgl1-mesa-dev zlib1g-dev \
            perl nasm patchelf file curl xz-utils

      - name: Build native runtimes
        run: |
          ./scripts/build-fbneo.sh
          ./scripts/build-snes9x.sh
          ./scripts/build-flycast.sh

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Run protocol tests
        run: ctest --test-dir build-appimage --output-on-failure

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Deckade-AppImage-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
